
<!DOCTYPE html>
<html>
<head>
    <title>Task 5</title>
</head>
<body>

    <button id="clickButton">Click me</button>

    <script>
        document.getElementById("clickButton").addEventListener("click", function() {

            let numbers = [];

            for (let i = 0; i <= 100; i++) {
                numbers.push(i);
            }

            let sum = 0;

            for (let i = 0; i < numbers.length; i++) {
                if (numbers[i] % 2 === 0) {
                    sum += numbers[i];
                }
            }

            document.write("The sum is: " +sum);
        });
    </script>

</body>
</html>
