<!DOCTYPE html>
<html>
<head>
    <title>Task 6</title>
</head>
<body>

    <button id="button1">Button One</button>
    <button id="button2">Button Two</button>
    <button id="button3">Button Three</button>
    <button id="button4">Button Four</button>
    <button id="button5">Button Five</button>

    <script>
        // Button One
        document.getElementById("button1").addEventListener("click", function() {
            let numbers = [];

            for (let i = 0; i <= 100; i++) {
                numbers.push(i);
            }

            numbers = numbers.filter(function(number) {
                return number % 3 !== 0;
            });

            console.log(numbers);
        });


        // Button Two
        document.getElementById("button2").addEventListener("click", function() {
            let numbers = [];

            for (let i = 0; i <= 100; i++) {
                numbers.push(i);
            }

            for (let i = 100; i <= 150; i++) {
                numbers.push(i);
            }

            console.log(numbers);
        });


        // Button Three
        document.getElementById("button3").addEventListener("click", function() {
            let numbers = [];

            for (let i = 0; i <= 100; i++) {
                numbers.push(i);
            }

            numbers = numbers.map(function(number) {
                return number + 3;
            });

            console.log(numbers);
        });


        // Button Four
        document.getElementById("button4").addEventListener("click", function() {
            let numbers = [];

            for (let i = 0; i <= 100; i++) {
                numbers.push(i);
            }

            console.log(numbers.slice(20, 41));
        });


        // Button Five
        document.getElementById("button5").addEventListener("click", function() {
            let numbers = [];

            for (let i = 0; i <= 100; i++) {
                numbers.push(i);
            }

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            shuffleArray(numbers);

            console.log(numbers);

            numbers.sort(function(a, b) {
                return b - a;
            });

            console.log(numbers);
        });
    </script>

</body>
</html>
