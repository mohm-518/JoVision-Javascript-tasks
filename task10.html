
<!DOCTYPE html>
<html>
<head>
    <title>Task 9</title>
</head>
<body>


    

    <button id="getIp">Get ip</button>

    
    <script>
         
        document.getElementById("getIp").addEventListener("click", function() {
            fetch("https://api.ipify.org/")
                .then(function(response) {
                    return response.text();
                })
                .then(function(ip) {
                 
                    document.getElementById("getIp").textContent = ip;
                   
                });
        });
        
    </script>

</body>
</html>
